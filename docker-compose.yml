services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-build-journal-api}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: 'postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-build-journal-api}?schema=public'
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-JWT_SECRET}
    ports:
      - '3000:3000'
    restart: unless-stopped
    command: node dist/main

volumes:
  db_data:
